<!DOCTYPE html>
<html>
<head>
    <title>Swagger Test</title>
</head>
<body>
    <h1>Django Project Status</h1>
    <p>Testing if the application is running...</p>
    <button onclick="testConnection()">Test Connection</button>
    <div id="result"></div>

    <script>
        function testConnection() {
            fetch('http://localhost:8000/swagger/')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').innerHTML = '<h2>Success! Swagger page is accessible</h2>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = '<h2>Error: ' + error + '</h2>';
                });
        }
    </script>
</body>
</html>
