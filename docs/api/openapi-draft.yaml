                    $ref: "#/components/schemas/Pagination"
    post:
      tags: [Assets]
      summary: Upload project assets
      x-status: ✅
      description: >
        Implemented in both Flask (multipart/form-data with storage_uri bridge)
        and FastAPI (multipart + storage URI write). Accepts asset_type, files[],
        optional relative_paths and replace_existing flag.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [asset_type, files]
              properties:
                asset_type:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                relative_paths:
                  type: string
                replace_existing:
                  type: boolean
                expected_versions:
                  type: string
                  description: 更新输入时必须提供 upload-impact 返回的完整预期版本集合的 JSON 字符串，空集合也需显式提供；已保存操作的幂等重试沿用原记录
                asset_set:
                  type: string
                operation_id:
                  type: string
                  format: uuid
                  description: Flask 上传操作标识；重复提交返回原保存记录，不再次替换版本
      responses:
        "201":
          description: Uploaded assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
