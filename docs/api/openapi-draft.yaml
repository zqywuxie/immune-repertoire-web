        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - {name: asset_set, in: query, schema: {type: string}, description: 按明确保存的数据集筛选，不将缺失来源视为 Set1}
        - {name: job_id, in: query, schema: {type: string}, description: 完整来源任务标识，精确匹配}
        - {name: unscoped, in: query, schema: {type: boolean, default: false}, description: 仅未记录数据集的结果，与 asset_set 互斥}
      responses:
