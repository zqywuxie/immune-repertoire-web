          schema: {type: string}
          description: full 模式用于匹配指标表或该来源的规范化输入路径
        - name: asset_set
          in: query
          schema: {type: string}
          description: summary 模式过滤所属数据集及通用方案；full 模式保持全集并显示适用性
        - name: q
          in: query
          schema: {type: string}
          description: summary 模式名称搜索，百分号和下划线按字面匹配
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 完整列表或分页摘要
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [group_specs]
                    properties:
                      group_specs:
                        type: array
                        items: {$ref: "#/components/schemas/ProjectGroupSpec"}
                  - {$ref: "#/components/schemas/ProjectGroupSpecCatalog"}
        "400":
          description: 不支持的列表视图
    post:
      tags: [Projects]
      summary: 创建方案或按稳定 ID 更新，保存不可变版本文件
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: view
          in: query
          schema: {type: string, enum: [full, detail], default: full}
          description: detail 只返回已保存方案的完整定义与 revision，不重新读取项目全集
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, spec_json]
              properties:
                id:
                  type: string
                  description: 编辑已有方案时提供；必须属于当前项目。更新保留未提交属性。
                expected_revision:
                  type: string
                  description: 编辑已有方案时必须提供读取时的 revision；事务内版本变化返回 409，草稿应保留
                name: { type: string }
                spec_json:
                  type: object
                  additionalProperties: true
                  properties:
                    groups:
                      type: array
                      items:
                        oneOf:
                          - { type: string }
                          - { type: object, additionalProperties: true }
                    group_field: { type: string }
                    source_asset_id: { type: string }
                    source_content_version: { type: string }
                    source_sheet: { type: string, nullable: true }
                    asset_set: { type: string }
      responses:
        "201":
          description: 当前方案及新的不可变文件资产；来源绑定的字段、分组和版本已验证
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [asset, group_specs]
                    properties:
                      asset: {$ref: "#/components/schemas/Asset"}
                      group_specs:
                        type: array
                        items: {$ref: "#/components/schemas/ProjectGroupSpec"}
                  - type: object
                    required: [group_spec]
                    properties:
                      group_spec: {$ref: "#/components/schemas/ProjectGroupSpec"}
        "400":
          description: 无效方案、缺少编辑版本、名称重复、来源版本或分组不匹配
        "409":
          description: GROUP_SPEC_CHANGED，方案已更新或删除，当前编辑需重新读取或另存
