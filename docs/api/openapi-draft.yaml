  /api/script-hub/volcano/inspect:
    post:
      tags: [Jobs]
      summary: 检查差异分析的实际输入
      description: >
        项目调用提交 project_id、asset_set、upstream_artifact_id；usage 模式返回所选产物
        的真实分组和 samples_by_value（保留前导零及批次复合编号）。文件输入仅检查该文件，
        目录输入按计算时相同规则合并链表，不写入来源目录。expression 模式返回表达矩阵自己的 groups、sample_count 和 samples_by_value，保留前导零。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: {type: string}
                asset_set: {type: string}
                upstream_artifact_id: {type: string}
                input_mode: {type: string, enum: [usage, expression], default: usage}
                data_dir: {type: string}
                expression_path: {type: string}
                group_prefix: {type: string, default: tpm_}
      responses:
        '200': {description: 返回实际文件、样本、分组与建议比較；usage 另返回 samples_by_value}
        '400': {description: 来源不可用或输入无法解析}
  /api/script-hub/volcano/run:
    post:
      tags: [Jobs]
      summary: 按实际比较与样本启动差异分析
      description: >
        usage 的 selected_categories 和 selected_samples 使用检查返回的精确分组和行编号，
        不从 Profile 的 selected_samples_by_group 推测。省略选择表示全部，显式空列表拒绝执行。
        比较前组 / 后组，反向比较会翻转 log2FC；保留双侧秩和检验、至少一组 3 个非零样本、
        原始 P 值显著性和 BH q_value 报告。expression 沿用 limma 及 FDR 筛选；
        selected_expression_groups 和 selected_expression_samples 分别是实际分组及表达列名，
        全部所选列参与分位数归一化，每个比较的两组各需至少两个所选样本。
        两种模式显式空比较均拒绝。输出名称仅用于元数据，原生结果目录分析类型固定 volcano。
        批次依赖默认绑定当前前置任务带分组的 1VJusage；usage_type 可明确选择 0VJusage，
        多分组时须通过 group_field 指定实际分组目录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: {type: string}
                asset_set: {type: string}
                upstream_artifact_id: {type: string}
                input_mode: {type: string, enum: [usage, expression], default: usage}
                data_dir: {type: string}
                expression_path: {type: string}
                group_prefix: {type: string, default: tpm_}
                comparisons:
                  type: array
                  items: {type: array, items: {type: string}, minItems: 2, maxItems: 2}
                selected_categories: {type: array, items: {type: string}}
                selected_samples: {type: array, items: {type: string}}
                selected_expression_groups: {type: array, items: {type: string}}
                selected_expression_samples: {type: array, items: {type: string}}
                pvalue_threshold: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
                logfc_cutoff: {type: number, minimum: 0, default: 1}
                output_name: {type: string}
      responses:
        '200': {description: 返回任务编号及缓存签名，或复用匹配结果}
        '400': {description: 来源、样本范围、比较或阈值无效}
  /api/script-hub/umapin/inspect:
    post:
      tags: [Jobs]
      summary: 检查旧特征降维的实际输入与样本
      description: >
        项目调用提交 project_id、asset_set 和 upstream_artifact_id，后端按该数据集解析结果。
        返回特征表自己的分组和行样本编号，包括已有批次复合编号，不从样本指标表推测。
        兼容无项目的 data_path 文件或目录调用。检查不启动降维，也不写入来源目录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: {type: string}
                asset_set: {type: string}
                upstream_artifact_id: {type: string}
                data_path: {type: string}
                category_col: {type: string, default: Category}
                sample_column: {type: string}
      responses:
        '200':
          description: 实际输入信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data_path: {type: string}
                  sample_count: {type: integer}
                  sample_column: {type: string}
                  category_col: {type: string}
                  feature_columns: {type: array, items: {type: string}}
                  pvalue_columns: {type: array, items: {type: string}}
                  values: {type: array, items: {type: string}}
                  samples_by_value:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
        '400': {description: 来源不可用或实际输入字段无效}
  /api/script-hub/umapin/run:
    post:
      tags: [Jobs]
      summary: 启动旧特征表 UMAP 降维
      description: >
        分组及样本按文本保存，selected_categories 使用检查返回的分组值，selected_samples
        使用 samples_by_value 中的精确行编号，可分别选取跨批次同名样本。
        未提交选择表示全部，显式空列表表示没有选择；筛选后少于三个样本拒绝运行。
        本接口不使用 selected_samples_by_group 或 group_sample_identity 推测特征行。
        未指定特征范围时采用数值候选范围；显式范围必须两端同时给出且顺序有效。
        保留标准化、缺失数值填零及固定随机种子 8。do_fdr 只对明确 p 值列执行
        既有最多 3 列、0.05 BH 校正，结果元数据记录 fdr_status 与 warnings。
        输出名称写入元数据，结果目录的分析类型固定为 umapin。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: {type: string}
                asset_set: {type: string}
                upstream_artifact_id: {type: string}
                data_path: {type: string}
                category_col: {type: string, default: Category}
                sample_column: {type: string}
                param_begin: {type: string}
                param_over: {type: string}
                selected_categories: {type: array, items: {type: string}}
                selected_samples: {type: array, items: {type: string}}
                n_neighbors: {type: integer, minimum: 2, default: 6}
                min_dist: {type: number, minimum: 0, maximum: 1, default: 0.01}
                n_epochs: {type: integer, minimum: 1, default: 100}
                do_fdr: {type: boolean, default: false}
                output_name: {type: string}
      responses:
        '200': {description: 返回任务编号及缓存签名，或复用匹配的已完成结果}
        '400': {description: 样本选择、字段、范围、参数或上游来源无效}
  /api/script-hub/boxplot/group-values:
    post:
      tags: [Jobs]
      summary: 读取分组与可选样本，支持批次编号
      description: >
        样本及分组按文本读取，保留前导零。指定 batch_field 后，samples_by_value
        返回批次::样本编号，两个部分中的 % 转为 %25，:: 转为 %3A%3A；
        sample_labels 提供界面显示名，sample_ids 提供原始编号。
        克隆共享、生成概率、优势克隆、数据库比对、特殊 T 细胞、机器学习和统一 UMAP 分析提交该类组选时必须同时提交 group_sample_identity=batch_sample
        与 batch_field；selected_samples_by_group 使用上述标识，selected_samples
        仍只接受原始样本编号。未提交 group_sample_identity 的旧任务沿用原编号筛选。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path, column]
              properties:
                file_path: {type: string}
                column: {type: string}
                batch_field: {type: string}
                sample_col: {type: string, description: 可明确指定实际样本编号列，否则按标准列名识别}
      responses:
        "200":
          description: 分组与样本选择
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  values: {type: array, items: {type: string}}
                  samples_by_value:
                    type: object
                    additionalProperties: {type: array, items: {type: string}}
                  sample_labels:
                    type: object
                    additionalProperties: {type: string}
                  sample_ids:
                    type: object
                    additionalProperties: {type: string}
        "400":
          description: 批次字段不存在、编号为空或同批次内重复
  /api/script-hub/go-kegg-enrichment/inspect:
    post:
      tags: [Jobs]
      summary: 检查表达矩阵的真实分组和样本列
      description: >
        提交 project_id、asset_set、group_prefix，返回 groups、sample_count、samples_by_value
        和建议比较。项目矩阵按注册资产解析；检查不计算差异或写入来源文件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: {type: string}
                asset_set: {type: string}
                expression_path: {type: string}
                group_prefix: {type: string, default: tpm_}
      responses:
        '200': {description: 表达列、真实分组及建议比较}
        '400': {description: 来源无效}
  /api/script-hub/go-kegg-enrichment/run:
    post:
      tags: [Jobs]
      summary: 从表达矩阵或已完成差异结果启动富集
      description: >
        expression 模式按实际 selected_expression_groups、selected_expression_samples 和 comparisons
        运行 limma；省略选择为全部，显式空选择或比较拒绝，各比较每组至少两个样本。
        deg 模式使用 upstream_artifact_id，沿用完整来源表的 significant 标记、统计值和元数据；
        隐藏的表达选择、差异比较及阈值不影响计算或缓存。启用 GSEA 必须包含 t 列。
        运行与缓存查询共用规范化参数；默认 BH、阈值 0.05、展示 10 条，不合并 GO 冗余项，启用 GSEA。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: {type: string}
                asset_set: {type: string}
                input_mode: {type: string, enum: [expression, deg], default: expression}
                upstream_artifact_id: {type: string}
                expression_path: {type: string}
                group_prefix: {type: string, default: tpm_}
                selected_expression_groups: {type: array, items: {type: string}}
                selected_expression_samples: {type: array, items: {type: string}}
                comparisons:
                  type: array
                  items: {type: array, items: {type: string}, minItems: 2, maxItems: 2}
                pvalue_threshold: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
                logfc_cutoff: {type: number, minimum: 0, default: 1}
                enrich_pvalue_cutoff: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
                p_adjust_method: {type: string, enum: [none, BH, BY, holm, bonferroni, hochberg, hommel, fdr], default: BH}
                show_category: {type: integer, minimum: 1, default: 10}
                simplify_go: {type: boolean, default: false}
                do_gsea: {type: boolean, default: true}
                output_name: {type: string}
      responses:
        '200': {description: 任务标识及缓存签名，或匹配的历史结果}
        '400': {description: 来源、样本、比较、阈值或差异表字段无效}
  /api/script-hub/go-kegg-enrichment/sources:
    get:
      tags: [Results]
      summary: 查询当前项目和数据集的差异表达来源
      description: >
        默认保留完整候选契约；view=summary 仅返回当前范围统计，view=catalog 返回服务器搜索分页的轻量来源。
        管理视图仍沿用完整来源核对，分页限制响应大小，不代表校验已避免全量扫描。
        仅列出表达模式的差异分析。候选包含不可用原因；调用方只能选择 available 项。
        复用时向 /api/script-hub/go-kegg-enrichment/run 提交 project_id、asset_set、
        input_mode=deg、upstream_artifact_id，后端解析来源，执行时再次核对文件快照。
        富集沿用完整差异表中的筛选结果，不重新计算差异；GSEA 还要求 t 列。
        批次 /api/script-hub/batches 可让富集项的 upstream_from 指向前序
        volcano 且 input_mode=expression 的项目，服务端待其完成后绑定本批次结果。
        upstream_from 是从零开始的前序项目索引，V/J 使用差异不兼容此依赖。
      parameters:
        - in: query
          name: project_id
          required: true
          schema: {type: string}
        - in: query
          name: asset_set
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/UpstreamView'
        - $ref: '#/components/parameters/UpstreamQuery'
        - $ref: '#/components/parameters/UpstreamStatus'
        - $ref: '#/components/parameters/UpstreamPage'
        - $ref: '#/components/parameters/UpstreamPageSize'
      responses:
        '200':
          description: 候选列表，可为空
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpstreamDifferentialFullResponse'
                  - $ref: '#/components/schemas/UpstreamSummaryResponse'
                  - $ref: '#/components/schemas/UpstreamCatalogResponse'
        '400':
          description: 缺少数据集或参数无效
        '403':
          description: 无权访问项目
        '404':
          description: 项目不存在
  /api/jobs/results/archive:
    post:
      tags: [Results]
      summary: 打包下载所选任务结果
      description: 核对任务访问权和文件归属，任一文件不可读时返回错误，不生成缺文件的成功包。支持 application/json 和浏览器原生表单下载；后者以 items 字段提交 JSON 数组，避免前端将整个压缩包读入内存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [job_id, url]
                    properties:
                      job_id: {type: string}
                      url: {type: string, description: 任务结果清单中的本地文件链接}
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: string, description: 上述 items 数组的 JSON 字符串}
      responses:
        '200':
          description: 按任务分目录的压缩包，重复选择去重
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400': {description: 选择项或文件链接不正确}
        '404': {description: 任务不存在或无权访问}
        '403': {description: 浏览器表单下载来源与当前站点不一致}
        '409': {description: 文件缺失或不可读取}
        '413': {description: 所选文件超过打包大小限制}
  /api/jobs/{job_id}/table-preview:
    post:
      tags: [Results]
      summary: 分页查看、筛选与排序完整结果数据表
      description: 支持 UTF-8 CSV 与 TSV；保留字符串值，筛选全部记录后按偏移返回一页。排序使用临时磁盘，按指定列进行文本或精确数值排序；数值模式下空值及非数值置于末尾，同值保留原始顺序。
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, description: 当前任务结果清单中的数据表链接}
                offset: {type: integer, minimum: 0, default: 0}
                limit: {type: integer, minimum: 1, maximum: 100, default: 25}
                query: {type: string, default: '', description: 所有单元格不区分大小写的文本包含筛选}
                sort_column: {type: integer, nullable: true, minimum: 0, description: 从零开始的列索引；不指定时保留原始顺序}
                sort_direction: {type: string, enum: [asc, desc], default: asc}
                sort_mode: {type: string, enum: [text, numeric], default: text, description: 数值模式支持科学计数法且不改变返回原文}
      responses:
        '200':
          description: 数据页与完整表及匹配记录计数
          content:
            application/json:
              schema:
                type: object
                required: [success, columns, rows, total_rows, matched_rows, offset, limit]
                properties:
                  success: {type: boolean}
                  columns: {type: array, items: {type: string}}
                  rows: {type: array, items: {type: array, items: {type: string}}}
                  total_rows: {type: integer}
                  matched_rows: {type: integer}
                  sort_column: {type: integer, nullable: true}
                  sort_direction: {type: string, enum: [asc, desc]}
                  sort_mode: {type: string, enum: [text, numeric]}
                  offset: {type: integer}
                  limit: {type: integer}
        '400': {description: 分页参数、文件链接或类型不正确}
        '404': {description: 任务不存在或无权访问}
        '409': {description: 文件缺失或不可读取}
        '422': {description: 编码或表格格式无法解析}
        '503': {description: 临时排序空间或文件读取不可用}
  /api/info:
    get:
      tags: [System]
      summary: Get application metadata
      x-status: ✅
      responses:
        "200":
          description: Application information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
  /api/projects:
    get:
      tags: [Projects]
      summary: 当前用户项目的服务器搜索和分页
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 24}}
        - {name: q, in: query, description: 项目名称或机构的字面子串搜索, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [created_desc, updated_desc, name_asc, name_desc], default: created_desc}}
        - {name: view, in: query, description: selector 仅返回项目身份和基础字段，不读取资产统计, schema: {type: string, enum: [summary, selector], default: summary}}
        - {name: name, in: query, schema: {type: string}}
        - {name: institution, in: query, schema: {type: string}}
        - {name: cooperation_level, in: query, schema: {type: string}}
      responses:
        "200":
          description: 当前页及全部匹配项目数量；全局概览统计通过 statistics 独立读取
          content:
            application/json:
              schema:
                type: object
                required: [projects, pagination]
                properties:
                  projects:
                    type: array
                    items: {$ref: "#/components/schemas/Project"}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "400":
          description: 无效列表类型或排序
    post:
      tags: [Projects]
      summary: Create a project
      x-status: ✅
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /api/projects/statistics:
    get:
      tags: [Projects]
      summary: 当前用户全部项目的独立统计
      description: 不受项目列表筛选和页码影响；保留当前输入、历史文件及 SQL/Mongo 产物身份口径。
      responses:
        "200":
          description: 全部已授权项目统计
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectStatistics"}
  /api/projects/{project_id}:
    get:
      tags: [Projects]
      summary: Get project detail with preview assets and samples
      x-status: ✅
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: summary_only
          in: query
          description: 只返回概览统计与分组方案，省略完整资产和登记预览；保留 SQL 与 Mongo 结果去重计数
          schema: {type: boolean, default: false}
        - name: include_group_specs
          in: query
          description: 仅在 summary_only=true 时有效；false 只保留方案计数，不读取完整定义；默认保留旧契约
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
    patch:
      tags: [Projects]
      summary: Update a project
      x-status: ✅
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /api/projects/{project_id}/input-selection:
    get:
      tags: [Projects]
      summary: 按数据集读取完整克隆选择及有限指标候选
      description: >
        只返回明确数据集的当前输入和轻量版本信息，不包含样本数组、完整校验报告或上传清单。
        克隆输入完整返回以保证默认分析不会漏选；每类单表输入最多返回 50 份候选，
        更多及历史版本通过既有 assets 搜索分页选择。仅用于选择，不替代实际输入检查。
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: asset_set
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "200":
          description: 范围内轻量资产、完整类型计数和受限候选类型
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectInputSelection"}
        "400":
          description: 未选择数据集、项目不存在或当前账号不可访问
  /api/projects/{project_id}/input-selection/resolve:
    post:
      tags: [Projects]
      summary: 批量恢复明确指定的当前或历史输入身份
      description: >
        只读操作。按项目、数据集和资产 ID 读取轻量信息，不切换版本，不返回完整校验报告或上传清单。
        每批最多 500 个 ID；任何输入缺失、错集、非分析输入或项目无权访问时整批失败。
        完整恢复必须在所有批次成功后应用，不用当前候选替换缺失的历史版本。
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_set, asset_ids]
              properties:
                asset_set: {type: string, minLength: 1}
                asset_ids:
                  type: array
                  maxItems: 500
                  items: {type: string, minLength: 1, maxLength: 36}
      responses:
        "200":
          description: 请求顺序的轻量输入身份，重复 ID 只返回一次
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectInputResolution"}
        "400":
          description: 请求无效或不能完整恢复所指定输入；不返回部分资产
  /api/projects/{project_id}/datasets:
    get:
      tags: [Projects]
      summary: 按数据集汇总当前四类输入与校验状态
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 不包含文件路径与完整校验报告；历史版本不计入汇总
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items:
                      type: object
                      required: [name, input_count, kinds]
                      properties:
                        name: {type: string, description: 不变的原数据集关联标识}
                        id: {type: string, description: 保存说明后分配的稳定目录标识}
                        display_name: {type: string}
                        description: {type: string}
                        source: {type: string}
                        batch: {type: string}
                        archived: {type: boolean}
                        revision: {type: integer, minimum: 1}
                        updated_at: {type: string, nullable: true, format: date-time}
                        input_count: {type: integer}
                        kinds:
                          type: object
                          additionalProperties:
                            type: object
                            required: [count, statuses]
                            properties:
                              count: {type: integer}
                              statuses:
                                type: object
                                additionalProperties: {type: integer}
                              sample_min: {type: integer, nullable: true}
                              sample_max: {type: integer, nullable: true}
    put:
      tags: [Projects]
      summary: 保存数据集说明、显示名与归档状态
      description: 只修改目录元数据；归档用于整理候选列表，可恢复，不删除文件、不取消任务、不改写资产、登记、分组或SQL/Mongo历史结果的原关联标识
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_set, expected_revision]
              properties:
                asset_set: {type: string, minLength: 1, maxLength: 120}
                expected_revision: {type: integer, minimum: 0, description: 尚无说明时为0；已保存时使用读取到的revision}
                display_name: {type: string, minLength: 1, maxLength: 120}
                description: {type: string, maxLength: 4000}
                source: {type: string, maxLength: 500}
                batch: {type: string, maxLength: 120}
                archived: {type: boolean}
      responses:
        '200':
          description: 已保存目录元数据
          content:
            application/json:
              schema:
                type: object
                required: [dataset]
                properties:
                  dataset: {$ref: '#/components/schemas/DatasetMetadata'}
        '400': {description: 字段无效或数据集不存在}
        '404': {description: 项目不存在或无权访问}
        '409': {description: 说明并发冲突，DATASET_RECORD_CHANGED返回最新目录元数据}
  /api/projects/{project_id}/assets/{asset_id}/lineage:
    get:
      tags: [Assets]
      summary: 分页查看资产的替换关系、引用任务和分组方案
      description: 仅当前账号所属项目。版本只沿已保存的替换标识关联，不按同名猜测；任务引用与删除保护使用相同规则。
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/AssetId"
        - name: section
          in: query
          schema: {type: string, enum: [versions, jobs, groups], default: versions}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 版本或引用清单，含精确标识和分页；不包含完整任务参数或校验报告
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetLineageResponse"}
        "400":
          description: 项目或资产不可访问，或分类无效

  /api/projects/{project_id}/assets/{asset_id}/table-preview:
    get:
      tags: [Assets]
      summary: 预览项目输入表或目录内选定子表
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/AssetId"
        - name: file
          in: query
          description: 已登记目录内的相对子表路径；不允许越界或符号链接
          schema: {type: string}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: include_files
          description: 选择具体子表格时可设为 false，跳过目录扫描；目录列表由原请求保留。
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: 目录分页清单与最多五行原编号预览
          content:
            application/json:
              schema:
                type: object
                properties:
                  directory: {type: boolean}
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        size: {type: integer}
                  columns:
                    type: array
                    items: {type: string}
                  rows:
                    type: array
                    items:
                      type: array
                      items: {type: string}
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /api/projects/{project_id}/input-samples:
    get:
      tags: [Projects]
      summary: 分页读取输入识别样本及来源校验状态
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: asset_set
          in: query
          schema: {type: string}
        - name: q
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {type: string, enum: ["", needs_attention, multiple]}
        - name: registration_state
          in: query
          description: 在全范围匹配登记状态后再分页；与输入校验及版本状态独立
          schema: {type: string, enum: ["", unregistered, registered, multiple]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: 不合并不同数据集同编号，不创建补充登记记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        sample_id: {type: string}
                        asset_set: {type: string}
                        needs_version_selection: {type: boolean}
                        registration:
                          type: object
                          description: 批量登记身份状态；未筛选时只查当前页，筛选时先匹配全范围再分页；缺失映射回退原编号，显式 null 不回退，不产生新登记
                          properties:
                            status: {type: string, enum: [unregistered, registered, multiple]}
                            count: {type: integer, minimum: 0}
                        coverage:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: object
                              properties:
                                asset_id: {type: string}
                                name: {type: string}
                                status: {type: string}
                  input_scopes:
                    type: object
                    description: 当前查询范围内各数据集、各输入类型的文件与未完成识别数量；不包含历史版本
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        required: [asset_count, unresolved_count]
                        properties:
                          asset_count: {type: integer, minimum: 0}
                          unresolved_count: {type: integer, minimum: 0}
                  unresolved:
                    type: array
                    items: {type: object}
                  note: {type: string}
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /api/projects/{project_id}/samples/batch/template:
    post:
      tags: [Projects]
      summary: 下载指定数据集或所选登记的中文 Excel 文本模板
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_set]
              properties:
                asset_set: {type: string, minLength: 1, maxLength: 120}
                record_ids:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: {type: string}
      responses:
        "200":
          description: 原始编号按文本保存；未指定记录时包含数据集已识别样本与已有登记，超上限明确拒绝
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
  /api/projects/{project_id}/samples/batch/preview:
    post:
      tags: [Projects]
      summary: 只读预览批量登记差异，不写入登记
      description: >
        项目、数据集、原始编号与可选记录标识精确匹配。空白默认不修改，clear_fields 显式清空。
        重复或模糊匹配不会自动合并。未匹配编号仅在 allow_unmatched=true 时可补录，且不加入分析输入。
        最多 5000 行，文件不超过 10 MB；Excel 数字编号拒绝，防止前导零丢失。
        可用 record_ids 限定所选登记，范围外或未保留记录标识的行不可保存。
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset_set, rows]
              properties:
                asset_set: {type: string, minLength: 1, maxLength: 120}
                allow_unmatched: {type: boolean, default: false}
                record_ids:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: {type: string}
                  description: 可选的精确登记范围，所有标识必须属于本项目和数据集
                rows:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: {$ref: "#/components/schemas/SampleBatchInput"}
          multipart/form-data:
            schema:
              type: object
              required: [asset_set, file]
              properties:
                asset_set: {type: string, minLength: 1, maxLength: 120}
                allow_unmatched: {type: string, enum: ["true", "false"], default: "false"}
                record_ids: {type: string, description: 可选的登记标识 JSON 数组，仅允许修改这些记录}
                file: {type: string, format: binary, description: .xlsx 或 UTF-8 CSV}
      responses:
        "200":
          description: 逐行差异、有效状态与绑定当前账户项目的签名预览，24 小时有效
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SampleBatchPreview"}
  /api/projects/{project_id}/samples/batch/apply:
    post:
      tags: [Projects]
      summary: 确认批量登记并返回逐行保存结果
      description: >
        保存前重新核对原值和输入范围，冲突不覆盖。成功行保留，失败行可指定 rows 重试。
        响应中断时复用同一预览，已保存行通过持久化回执核对，不重复新增或覆盖后续修改。
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_token]
              properties:
                preview_token: {type: string}
                rows:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: integer, minimum: 1}
      responses:
        "200":
          description: 成功、无变化与失败行；错误行不妨碍有效行保存
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SampleBatchResult"}

  /api/projects/{project_id}/samples/registration:
    get:
      tags: [Projects]
      summary: 查看已识别样本的补充登记，读取不自动创建
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: sample_id
          in: query
          required: true
          schema: {type: string}
        - name: asset_set
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 指定项目、数据集和原始编号的登记，未登记时 sample 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  sample: {type: object, nullable: true}
                  project_name: {type: string}
    post:
      tags: [Projects]
