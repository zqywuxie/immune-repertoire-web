      responses:
        "200":
          description: Asset file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/jobs:
    get:
      tags: [Jobs]
      summary: List background jobs
      x-status: ✅
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                required: [success, jobs]
                properties:
                  success:
                    type: boolean
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      tags: [Jobs]
      summary: Submit a unified background job
      x-status: ✅
      description: >
        Implemented in both Flask (bridge endpoint) and FastAPI (DB insert +
        21-module validation). Long-term workers should accept only job_id and
        read payload from storage/database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [module, payload]
              properties:
                module:
                  type: string
                  examples: ["charts.combined"]
                payload:
                  type: object
                  additionalProperties: true
                project_id:
                  type: string
                force_rerun:
                  type: boolean
      responses:
        "200":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                required: [success, job_id]
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: string
                  task_id:
                    type: string
                  status_url:
                    type: string
                  status:
                    type: string
                  reused_result:
                    type: boolean
                  result_id:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
        "400":
          description: Unsupported job module
  /api/jobs/modules:
    get:
      tags: [Jobs]
      summary: List frontend-visible background job modules
      x-status: ✅
      responses:
        "200":
          description: Job modules
          content:
            application/json:
              schema:
                type: object
                required: [success, modules]
                properties:
                  success:
                    type: boolean
                  modules:
                    type: array
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key:
                          type: string
                        label:
                          type: string
  /api/jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Get a background job
      x-status: ✅
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job:
                    $ref: "#/components/schemas/Job"
  /api/jobs/{job_id}/events:
    get:
      tags: [Jobs]
      summary: Stream job lifecycle events via SSE
      description: >
        Server-Sent Events stream delivering job status updates in real-time.
        Emits "update" events on each poll cycle and a terminal "completed"
        event when the job reaches a final status.  Clients reconnect on
        connection loss.
      x-status: ✅
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: interval
          in: query
          schema:
            type: number
            minimum: 0.2
            maximum: 30.0
            default: 1.0
        - name: max_events
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 300
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/jobs/{job_id}/results:
    get:
      tags: [Jobs]
      summary: Get normalized job result outputs
      x-status: ✅
      description: >
        Returns the persistent job record, raw result payload, normalized output
        links, and project result assets registered for the job.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job result bundle
          content:
            application/json:
              schema:
                type: object
                required: [success, job, status, result, outputs, assets]
                properties:
                  success:
                    type: boolean
                  job:
                    $ref: "#/components/schemas/Job"
                  status:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                  outputs:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobOutput"
                  assets:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Asset"
                        - type: object
                          properties:
                            preview_url:
                              type: string
                            download_url:
                              type: string
        "404":
          description: Job not found
  /api/jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      summary: Request job cancellation
      x-status: ✅
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Cancellation state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job:
                    $ref: "#/components/schemas/Job"
components:
  parameters:
    UpstreamView:
      in: query
      name: view
      schema: {type: string, enum: [summary, catalog]}
      description: 缺省保留完整候选；summary 统计不受 q/status/page 筛选影响
    UpstreamQuery:
      in: query
      name: q
      schema: {type: string, maxLength: 200}
      description: 目录按任务名称、标识、时间、缓存类型或比较组别查找
    UpstreamStatus:
      in: query
      name: status
      schema: {type: string, enum: ['', available, unavailable]}
    UpstreamPage:
      in: query
      name: page
      schema: {type: integer, minimum: 1, default: 1}
    UpstreamPageSize:
      in: query
      name: page_size
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    AssetId:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    SampleEditPayload:
      type: object
      description: 补充登记入口只接受所列业务字段及 expected_values；兼容更新接口保留旧扩展字段契约
      properties:
        sample_name: {type: string}
        sequence_id: {type: [string, 'null']}
        spices: {type: [string, 'null']}
        institution: {type: [string, 'null']}
        chain_flag: {type: [string, 'null']}
        is_healthy: {type: [string, 'null']}
        illness: {type: [string, 'null']}
        is_pe: {type: [string, 'null']}
        contain_method: {type: [string, 'null']}
        iso_tag: {type: [string, 'null']}
        expected_values:
          type: object
          additionalProperties: {type: [string, 'null']}
          description: 与本次提交业务字段一一对应的原值；同字段变化返回409，不自动覆盖
    SampleFieldOptionsResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: object
          additionalProperties: {type: array, items: {type: string}}
    SampleFieldCatalogResponse:
      type: object
      required: [field, values, pagination]
      properties:
        field: {type: string, enum: [sample_id, sequence_id]}
        values: {type: array, items: {type: string}}
        pagination: {$ref: '#/components/schemas/SampleFieldCatalogPagination'}
    SampleFieldCatalogPagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    UpstreamSummary:
      type: object
      required: [total, available, unavailable, reasons]
      properties:
        total: {type: integer}
        available: {type: integer}
        unavailable: {type: integer}
        reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: {type: string}
              count: {type: integer}
    UpstreamCandidate:
      type: object
      required: [id, project_id, status, reason, source_task_name]
      properties:
        id: {type: string, description: 与原完整候选相同的不可替代产物标识}
        project_id: {type: string}
        job_id: {type: string}
        asset_set: {type: string}
        status: {type: string, enum: [available, unavailable]}
        reason: {type: string}
        source_task_name: {type: string}
        description: {type: string, description: 精简链、分组字段和比较方向说明}
        created_at: {type: string}
        cache_type: {type: string}
        comparison:
          type: object
          required: [group1, group2]
          properties:
            group1: {type: string}
            group2: {type: string}
    UpstreamCatalogPagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
        total_pages: {type: integer}
    UpstreamSummaryResponse:
      type: object
      required: [success, summary]
      properties:
        success: {type: boolean}
        summary: {$ref: '#/components/schemas/UpstreamSummary'}
    UpstreamCatalogResponse:
      type: object
      required: [success, summary, candidates, pagination]
      properties:
        success: {type: boolean}
        summary: {$ref: '#/components/schemas/UpstreamSummary'}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/UpstreamCandidate'}
        pagination: {$ref: '#/components/schemas/UpstreamCatalogPagination'}
    UpstreamLegacyFullResponse:
      type: object
      required: [success, candidates]
      properties:
        success: {type: boolean}
        candidates:
          type: array
          items: {type: object, additionalProperties: true}
    UpstreamDifferentialFullResponse:
      type: object
      required: [success, candidates]
      properties:
        success: {type: boolean}
        candidates:
          type: array
          items:
            type: object
            required: [id, job_id, project_id, asset_set, status, reason, files, metadata]
            properties:
              id: {type: string, description: 提交时原样传递的产物标识}
              job_id: {type: string}
              project_id: {type: string}
              asset_set: {type: string}
              status: {type: string, enum: [available, unavailable]}
              reason: {type: string}
              path: {type: string, description: 服务端目录，不作为客户端指定输入}
              created_at: {type: [string, 'null']}
              metadata: {type: object, additionalProperties: true}
              files:
                type: array
                items:
                  type: object
                  properties:
                    relative_path: {type: string}
                    size: {type: integer}
                    mtime_ns: {type: integer}
    ProjectGroupSpecSource:
      type: object
      required: [asset_id, name, asset_set, available, reason]
      properties:
        asset_id: {type: string, nullable: true}
        name: {type: string}
        asset_set: {type: string}
        content_version: {type: string, nullable: true}
        available: {type: boolean}
        reason: {type: string}
    ProjectGroupSpec:
      type: object
      required: [id, project_id, name, spec_json, revision, source]
      properties:
        id: {type: string}
        project_id: {type: string}
        name: {type: string}
        spec_json: {type: object, additionalProperties: true}
        revision: {type: string, description: 编辑时必须回传的不可变版本令牌}
        source: {$ref: "#/components/schemas/ProjectGroupSpecSource"}
        created_at: {type: string, format: date-time, nullable: true}
        updated_at: {type: string, format: date-time, nullable: true}
    ProjectGroupSpecSummary:
      type: object
      description: 只读卡片摘要；group_preview 不可作为完整 groups 保存
      required: [id, project_id, name, revision, source, group_count, group_preview, group_field, asset_set, project_wide]
      properties:
        id: {type: string}
        project_id: {type: string}
        name: {type: string}
        revision: {type: string}
        source: {$ref: "#/components/schemas/ProjectGroupSpecSource"}
        group_count: {type: integer, minimum: 0}
        group_preview:
          type: array
          maxItems: 6
          items: {type: string}
        group_field: {type: string}
        asset_set: {type: string}
        project_wide: {type: boolean}
        source_content_version: {type: string, nullable: true}
        created_at: {type: string, format: date-time, nullable: true}
        updated_at: {type: string, format: date-time, nullable: true}
    ProjectGroupSpecCatalog:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ProjectGroupSpecSummary"}
        pagination:
          type: object
          required: [page, page_size, total, total_pages]
          properties:
            page: {type: integer, minimum: 1}
            page_size: {type: integer, minimum: 1, maximum: 100}
            total: {type: integer, minimum: 0}
            total_pages: {type: integer, minimum: 0}
    ScriptHubInfiltrationInput:
      type: object
      properties:
        project_id: {type: string}
        asset_set: {type: string}
        group_field: {type: string}
        score_type: {type: string, enum: [relative, absolute, other]}
        cell_columns: {type: array, items: {type: string}}
        selected_infiltration_samples: {type: array, items: {type: string}}
        selected_infiltration_groups: {type: array, items: {type: string}}
        sample_scope_only: {type: boolean, default: false}
        subclass_columns: {type: array, items: {type: string}}
        sample_pairs:
          type: array
          items:
            type: object
            required: [deconvolution_sample, profile_sample]
            properties:
              deconvolution_sample: {type: string}
              profile_sample: {type: string}
        comparison: {type: array, items: {type: string}, minItems: 2, maxItems: 2}
        upstream_artifact_id: {type: string}
        output_name: {type: string}
    Project:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        user_id:
          type: integer
          nullable: true
        institution:
          type: string
          nullable: true
        cooperation_level:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
        asset_counts:
          type: object
          additionalProperties:
            type: integer
        sample_count:
          type: integer
        registered_sample_count:
          type: integer
        input_sample_count:
          type: integer
          description: Distinct dataset and original sample identifier pairs from input validation.
        dataset_count:
          type: integer
        historical_asset_count:
          type: integer
        asset_status:
          type: object
          properties:
            has_profile:
              type: boolean
            has_pep:
              type: boolean
            has_transcriptome:
              type: boolean
            has_deconvolution:
              type: boolean
            has_results:
              type: boolean
            asset_set_count:
              type: integer
        result_count:
          type: integer
        group_spec_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    SampleBatchInput:
      type: object
      required: [sample_id]
      additionalProperties: false
      properties:
        sample_id: {type: string, minLength: 1, maxLength: 255}
        record_id: {type: string, description: 对已有登记进行精确选择，不能改变原始编号或归属}
        fields:
          type: object
          additionalProperties: false
          properties:
            sample_name: {type: string, maxLength: 255}
            sequence_id: {type: string, maxLength: 255}
            spices: {type: string, maxLength: 255}
            institution: {type: string, maxLength: 255}
            chain_flag: {type: string, maxLength: 255}
            is_healthy: {type: string, maxLength: 120}
            illness: {type: string, maxLength: 255}
            is_pe: {type: string, maxLength: 120}
            contain_method: {type: string, maxLength: 255}
            iso_tag: {type: string, maxLength: 255}
        clear_fields:
          type: array
          items: {type: string, description: 可编辑字段名或中文列名；样本名称不能清空}
    SampleBatchPreviewRow:
      type: object
      required: [row, sample_id, record_id, status, message, linked, can_apply, changes]
      properties:
        row: {type: integer, minimum: 1}
        sample_id: {type: string}
        record_id: {type: string, nullable: true}
        status: {type: string, enum: [new, update, unchanged, unmatched, invalid]}
        message: {type: string}
        linked: {type: boolean}
        can_apply: {type: boolean}
        changes:
          type: array
          items:
            type: object
            required: [field, label, before, after]
            properties:
              field: {type: string}
              label: {type: string}
              before: {type: string, nullable: true}
              after: {type: string, nullable: true}
    SampleBatchPreview:
      type: object
      required: [preview_token, project_name, asset_set, rows, counts]
      properties:
        preview_token: {type: string}
        project_name: {type: string}
        asset_set: {type: string}
        rows:
          type: array
          items: {$ref: "#/components/schemas/SampleBatchPreviewRow"}
        counts:
          type: object
          properties:
            new: {type: integer}
            update: {type: integer}
            unchanged: {type: integer}
            unmatched: {type: integer}
            invalid: {type: integer}
    SampleBatchResultRow:
      type: object
      required: [row, sample_id, status, message]
      properties:
        row: {type: integer, minimum: 1}
        sample_id: {type: string}
        status: {type: string, enum: [saved, unchanged, failed]}
        message: {type: string}
        record_id: {type: string}
        replayed: {type: boolean}
    SampleBatchResult:
      type: object
      required: [rows, counts, asset_set]
      properties:
        rows:
          type: array
          items: {$ref: "#/components/schemas/SampleBatchResultRow"}
        counts:
          type: object
          properties:
            saved: {type: integer}
            unchanged: {type: integer}
            failed: {type: integer}
        asset_set: {type: string}

    UploadImpactItem:
      type: object
      required: [asset_type, asset_set, name, directory]
      properties:
        asset_type:
          type: string
          enum: [pep, profile, datapoint, transcriptome, deconvolution, cibersort]
        asset_set: {type: string, minLength: 1, maxLength: 120}
        name: {type: string, minLength: 1, maxLength: 255}
        directory: {type: boolean}
    ExpectedInputVersion:
      type: object
      required: [id, content_version]
      properties:
        id: {type: string}
        content_version: {type: string}
    UploadImpact:
      allOf:
        - $ref: "#/components/schemas/UploadImpactItem"
        - type: object
          required: [expected_versions, assets, pagination]
          properties:
            expected_versions:
              type: array
              items:
                $ref: "#/components/schemas/ExpectedInputVersion"
            assets:
              type: array
              items:
                type: object
                required: [id, original_name, uploaded_at, content_version]
                properties:
                  id: {type: string}
                  original_name: {type: string}
                  uploaded_at: {type: string, nullable: true}
                  content_version: {type: string}
            pagination:
              $ref: "#/components/schemas/Pagination"
    ProjectStatistics:
      type: object
      required: [project_count, status_counts, file_count, result_count, input_sample_count, registered_sample_count, dataset_count, group_spec_count]
      properties:
        project_count: {type: integer}
        pep_project_count: {type: integer, description: 含当前克隆输入的项目数量}
        status_counts: {type: object, additionalProperties: {type: integer}}
        file_count: {type: integer, description: 当前文件和去重产物数量，不含退休输入}
        result_count: {type: integer}
        input_sample_count: {type: integer, description: 按项目、数据集和原始编号去重的输入样本条目}
        registered_sample_count: {type: integer}
        dataset_count: {type: integer}
        group_spec_count: {type: integer}
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            assets:
              type: array
              items:
                $ref: "#/components/schemas/Asset"
            group_specs:
              type: array
              items:
                type: object
            samples_preview:
              type: array
              items:
                type: object
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        institution:
          type: string
        cooperation_level:
          type: string
        description:
          type: string
        status:
          type: string
          default: active
    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        institution:
          type: string
        cooperation_level:
          type: string
        description:
          type: string
        status:
          type: string
    ProjectInputResolution:
      type: object
      required: [asset_set, assets]
      properties:
        asset_set: {type: string}
        assets:
          type: array
          items: {$ref: "#/components/schemas/Asset"}
    ProjectInputSelection:
      type: object
      required: [asset_set, assets, totals, truncated_kinds]
      properties:
        asset_set: {type: string}
        assets:
          type: array
          items: {$ref: "#/components/schemas/Asset"}
        totals:
          type: object
          additionalProperties: {type: integer, minimum: 0}
          description: 当前克隆、指标、转录组和浸润文件计数，类型别名归一
        truncated_kinds:
          type: array
          items: {type: string, enum: [profile, transcriptome, deconvolution]}
          description: 当前候选超过 50 份的单表类型；剩余候选通过搜索分页读取
    Asset:
      type: object
      required: [id, project_id, asset_type, original_name, storage_path, size]
      properties:
        id:
          type: string
        project_id:
          type: string
        asset_type:
          type: string
        original_name:
          type: string
        storage_path:
          type: string
          description: Legacy local path. Replace with storage_uri during Phase 4.
        storage_uri:
          type: string
          nullable: true
          description: Stable storage URI. During the Flask transition this is surfaced from metadata.storage_uri.
        mime_type:
          type: string
          nullable: true
        size:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        uploaded_at:
          type: string
          format: date-time
          nullable: true
    DatasetMetadata:
      type: object
      required: [id, name, display_name, description, source, batch, archived, revision, updated_at]
      properties:
        id: {type: string}
        name: {type: string, description: 不变的原数据集关联标识}
        display_name: {type: string}
        description: {type: string}
        source: {type: string}
        batch: {type: string}
        archived: {type: boolean}
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, nullable: true, format: date-time}
    QueueStatus:
      type: object
      description: 当前队列读取事实，只含汇总计数和本任务位置，不暴露其他任务或工作进程身份；只在 Redis 等待任务中返回
      required: [available, checked_at, state, position, message]
      properties:
        available: {type: boolean}
        checked_at: {type: string, format: date-time}
        state: {type: string, enum: [paused, no_workers, busy, waiting, missing, unavailable]}
        message: {type: string}
        position: {type: integer, nullable: true, minimum: 1, description: 当前等待队列位置，不是预计开始时间}
        position_available: {type: boolean, description: false 表示位置单独读取失败}
        online_workers: {type: integer, minimum: 0}
        busy_workers: {type: integer, minimum: 0}
        configured_concurrency: {type: integer, minimum: 1}
        paused: {type: boolean}
        queued_count: {type: integer, minimum: 0}
    Job:
      type: object
      required: [id, job_type, module, status, progress]
      properties:
        queue_status:
          $ref: "#/components/schemas/QueueStatus"
        id:
          type: string
        job_id:
          type: string
        job_type:
          type: string
        module:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, interrupted]
        cancel_requested:
          type: boolean
          description: A running job stays running until cancellation is confirmed by the worker.
        progress:
          type: number
        stage:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        user_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    JobOutput:
      type: object
      required: [label, url, kind]
      properties:
        label:
          type: string
        url:
          type: string
        kind:
          type: string
    AssetLineageResponse:
      type: object
      required: [section, items, pagination]
      properties:
        section: {type: string, enum: [versions, jobs, groups]}
        items:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
              created_at: {type: string, nullable: true}
              asset_type: {type: string}
              asset_set: {type: string}
              content_version: {type: string, nullable: true}
              superseded: {type: boolean}
              superseded_by: {type: array, items: {type: string}}
              module: {type: string}
              status: {type: string}
              match: {type: string, enum: [asset_id, path]}
        pagination:
          type: object
          required: [page, page_size, total, total_pages]
          properties:
            page: {type: integer}
            page_size: {type: integer}
            total: {type: integer}
            total_pages: {type: integer}
        unavailable_links: {type: integer, description: 当前版本链中指向不可访问资产的已知替换记录数}
    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
