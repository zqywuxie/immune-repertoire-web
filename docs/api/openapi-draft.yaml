            type: string
        - {in: query, name: view, schema: {type: string, enum: [full, selector], default: full}, description: Flask 候选选择模式}
        - {in: query, name: inputs_only, schema: {type: boolean, default: false}}
        - {in: query, name: asset_set, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}, description: Flask 输入按文件名及说明字面搜索}
        - {in: query, name: sort, schema: {type: string, enum: [uploaded_desc, uploaded_asc, name_asc, name_desc, size_asc, size_desc], default: uploaded_desc}, description: Flask full 输入列表在全筛选范围排序后分页，同值以 ID 稳定排序}
        - {in: query, name: include_superseded, schema: {type: boolean, default: false}}
        - {in: query, name: validation_status, schema: {type: string}, description: 过滤校验状态，支持 needs_attention}
        - name: page
          in: query
