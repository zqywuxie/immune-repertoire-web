openapi: 3.1.0
info:
  title: Immune Repertoire Platform API
  version: 0.2.0
  description: >
    Stable API contract for the frontend/backend separation migration. The current
    implementation is served by Flask (bridge phase), while this document defines
    the stable project, asset, job, and result surface that the standalone frontend
    should consume.

    **Implementation status (2026-06-29):**
    - ✅ Implemented in Flask → see `flask_app/routes/api_projects.py`, `api_jobs.py`
    - 🔄 Bridge implementation (Flask forwarding to module routes)
    - ⬜ Planned, not yet implemented

    See `docs/migration-progress.md` for detailed phase tracking.
servers:
  - url: http://127.0.0.1:5000
    description: Local Flask API
  - url: http://127.0.0.1:5173
    description: Vite dev server proxy
tags:
  - name: System
  - name: Projects
  - name: Assets
  - name: Jobs
  - name: Results
paths:
  /api/storage:
    get:
      tags: [System]
      summary: 当前授权范围的登记统计及适用共享容量
      description: 登记字节为条目累计，不是物理磁盘占用。管理员或内部免登录模式可以读取共享文件系统容量，同一文件系统合并标签。缓存未测量以 null 表示；不扫描目录，不返回服务器路径。
      responses:
        '200':
          description: 登记统计；容量读取失败保留 available=false，不填零
          content:
            application/json:
              schema:
                type: object
                required: [success, files, file_bytes, assets, asset_bytes, registered_categories, filesystem_capacity, capacity_visible, cache_bytes]
                properties:
                  success: {type: boolean}
                  files: {type: integer, minimum: 0}
                  file_bytes: {type: integer, minimum: 0}
                  assets: {type: integer, minimum: 0}
                  asset_bytes: {type: integer, minimum: 0}
                  registered_categories:
                    type: object
                    additionalProperties:
                      type: object
                      required: [count, bytes]
                      properties:
                        count: {type: integer, minimum: 0}
                        bytes: {type: integer, minimum: 0}
                  filesystem_capacity:
                    type: array
                    items:
                      type: object
                      required: [labels, available]
                      properties:
                        labels: {type: array, items: {type: string}}
                        available: {type: boolean}
                        total_bytes: {type: integer, minimum: 0}
                        used_bytes: {type: integer, minimum: 0}
                        free_bytes: {type: integer, minimum: 0}
                  capacity_visible: {type: boolean}
                  cache_bytes: {type: [integer, 'null']}
        '401': {description: 当前配置需要登录}

  /api/samples:
    get:
      tags: [Projects]
      summary: 查询授权范围内的补充登记
      description: input_sample_id 精确定位某输入编号的关联登记，必须同时指定项目和数据集；缺失映射回退原始编号，显式 null 不回退。保留既有业务字段筛选及分页。
      parameters:
        - {in: query, name: project_id, schema: {type: string}}
        - {in: query, name: asset_set, schema: {type: string}}
        - {in: query, name: input_sample_id, schema: {type: string}}
        - {in: query, name: sample_id, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: 授权登记记录；提供页码时返回筛选后的全范围计数
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples: {type: array, items: {type: object}}
                  pagination: {$ref: '#/components/schemas/Pagination'}
        '400': {description: 核对编号缺少项目或数据集范围}
  /api/samples/{sample_record_id}:
    put:
      tags: [Projects]
      summary: 更新登记中实际修改的字段
      description: >
        当前界面同时提交 expected_values，键必须与提交的业务字段完全一致，值为打开或最近核对时的原值。
        在项目及记录锁内比较，只拒绝同字段冲突；冲突时整次修改不落库。
        未携带 expected_values 的旧客户端保持原更新契约。
      parameters:
        - {in: path, name: sample_record_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SampleEditPayload'}
      responses:
        '200':
          description: 最新登记记录及原始身份
          content:
            application/json:
              schema: {type: object}
        '400': {description: 原值集合无效或字段校验失败}
        '409': {description: SAMPLE_RECORD_CHANGED；details 包含冲突字段的 expected/current/submitted 和当前 sample，供保留草稿后核对}
  /api/samples/field-options:
    get:
      tags: [Projects]
      summary: 样本登记筛选候选
      description: >
        不传 view 保留原完整字段候选。filters 排除高基数样本编号与序列编号；
        catalog 仅支持这两类编号，按当前用户可访问项目和指定数据集进行数据库去重、搜索和分页。
        q 中的百分号和下划线作为字面字符；编号保持文本。分页只限定候选，不改变已有样本列表筛选定义。
      parameters:
        - {in: query, name: project_id, schema: {type: string}}
        - {in: query, name: asset_set, schema: {type: string}}
        - {in: query, name: view, schema: {type: string, enum: [filters, catalog]}, description: 不传则使用完整旧契约}
        - {in: query, name: field, schema: {type: string}, description: catalog 必填 sample_id 或 sequence_id}
        - {in: query, name: q, schema: {type: string, maxLength: 200}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 完整／常规字段候选或分页编号目录
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SampleFieldOptionsResponse'
                  - $ref: '#/components/schemas/SampleFieldCatalogResponse'
        '400': {description: 候选类型、查询内容或分页参数不支持}
  /api/script-hub/pep-cache-candidates:
    get:
      tags: [Results]
      summary: 查询克隆共享前置结果
      description: >
        不传 view 时保留完整候选接口。管理视图要求明确项目和数据集，
        summary 只返回全范围可用性统计，catalog 返回轻量来源、筛选后分页及全范围统计。
        可用性沿用现有严格来源、文件及比较方向检查；分页限制响应大小，不免除完整核对。
      parameters:
        - {in: query, name: project_id, schema: {type: string}, description: 管理视图必填}
        - {in: query, name: asset_set, schema: {type: string}, description: 管理视图必填}
        - {in: query, name: cache_type, schema: {type: string}}
        - $ref: '#/components/parameters/UpstreamView'
        - $ref: '#/components/parameters/UpstreamQuery'
        - $ref: '#/components/parameters/UpstreamStatus'
        - $ref: '#/components/parameters/UpstreamPage'
        - $ref: '#/components/parameters/UpstreamPageSize'
      responses:
        '200':
          description: 原完整候选、管理摘要或分页来源目录
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpstreamLegacyFullResponse'
                  - $ref: '#/components/schemas/UpstreamSummaryResponse'
                  - $ref: '#/components/schemas/UpstreamCatalogResponse'
        '400': {description: 管理视图缺少明确范围或查询参数无效}
        '403': {description: 无权访问项目}
        '404': {description: 项目不存在}
  /api/script-hub/immune-infiltration-pathway/sources:
    get:
      tags: [Results]
      summary: 查询完整 GO-BP 通路来源
      description: >
        不传 view 时保留完整候选接口。管理视图要求明确项目和数据集，
        summary 只返回全范围可用性统计，catalog 返回轻量来源、筛选后分页及全范围统计。
        可用性沿用现有严格来源、文件及比较方向检查；分页限制响应大小，不免除完整核对。
      parameters:
        - {in: query, name: project_id, schema: {type: string}, description: 管理视图必填}
        - {in: query, name: asset_set, schema: {type: string}, description: 管理视图必填}
        - $ref: '#/components/parameters/UpstreamView'
        - $ref: '#/components/parameters/UpstreamQuery'
        - $ref: '#/components/parameters/UpstreamStatus'
        - $ref: '#/components/parameters/UpstreamPage'
        - $ref: '#/components/parameters/UpstreamPageSize'
      responses:
        '200':
          description: 原完整候选、管理摘要或分页来源目录
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UpstreamLegacyFullResponse'
                  - $ref: '#/components/schemas/UpstreamSummaryResponse'
                  - $ref: '#/components/schemas/UpstreamCatalogResponse'
        '400': {description: 管理视图缺少明确范围或查询参数无效}
        '403': {description: 无权访问项目}
        '404': {description: 项目不存在}
  /api/samples/export:
    get:
      tags: [Projects]
      summary: 导出授权范围内符合筛选的全部样本登记
      description: 与样本列表共用筛选，不受页码限制。分批读取并生成临时下载文件，响应关闭后释放文件。默认保留原始 CSV 字段；界面使用中文业务列。表格文件中的编号和内容均以文本保存。
      parameters:
        - {in: query, name: project_id, schema: {type: string}}
        - {in: query, name: asset_set, schema: {type: string}}
        - {in: query, name: sample_id, schema: {type: string}}
        - {in: query, name: input_sample_id, schema: {type: string}, description: 精确核对输入编号时必须提供项目和数据集}
        - {in: query, name: sample_name, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: project_name, schema: {type: string}}
        - {in: query, name: institution, schema: {type: string}}
        - {in: query, name: sequence_id, schema: {type: string}}
        - {in: query, name: contain_method, schema: {type: string}}
        - {in: query, name: iso_tag, schema: {type: string}}
        - {in: query, name: spices, schema: {type: string}}
        - {in: query, name: chain_flag, schema: {type: string}}
        - {in: query, name: is_healthy, schema: {type: string}}
        - {in: query, name: illness, schema: {type: string}}
        - {in: query, name: is_pe, schema: {type: string}}
        - {in: query, name: format, schema: {type: string, enum: [csv, xlsx], default: csv}}
        - {in: query, name: columns, schema: {type: string, enum: [legacy, business, technical], default: legacy}}
      responses:
        '200':
          description: 文件内容；X-Export-Count 是本次实际写入记录数。business 为中文常用列，technical 额外包含标识和原始补充信息，legacy 保留既有技术列与动态补充字段。
          headers:
            X-Export-Count:
              schema: {type: integer, minimum: 0}
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string, format: binary}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
        '400':
          description: 不支持的文件格式或字段范围
    post:
      tags: [Projects]
      summary: 导出当前授权及筛选范围内的所选样本登记
      description: 沿用 GET 导出的字段、格式及临时文件生命周期。以登记记录 ID 精确选择，重复 ID 去重；空选择、已移除、错数据集或不可访问的任一记录均拒绝整批，不回退全部数据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filters, record_ids]
              properties:
                filters: {type: object, additionalProperties: {type: string}, description: 与 GET 共用筛选，页码不参与导出}
                record_ids: {type: array, minItems: 1, maxItems: 5000, items: {type: string, minLength: 1, maxLength: 36}}
                format: {type: string, enum: [csv, xlsx], default: xlsx}
                columns: {type: string, enum: [legacy, business, technical], default: business}
      responses:
        '200':
          description: 实际所选登记文件，X-Export-Count 为去重后的写入数量
          headers:
            X-Export-Count: {schema: {type: integer, minimum: 1}}
          content:
            text/csv: {schema: {type: string, format: binary}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
        '400': {description: 所选 ID、格式或筛选无效，或所选记录不能完整恢复}
  /api/files:
    get:
      tags: [Assets]
      summary: 按项目和数据集列出已校验指标输入
      parameters:
        - {in: query, name: project, schema: {type: string}}
        - {in: query, name: asset_set, schema: {type: string}}
        - {in: query, name: include_superseded, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 当前已校验输入；明确启用时包含历史版本。未映射旧文件只在项目范围返回。
          content:
            application/json:
              schema:
                type: object
                required: [files, total]
                properties:
                  total: {type: integer}
                  files:
                    type: array
                    items:
                      type: object
                      required: [id, name, columns, row_count]
                      properties:
                        id: {type: string}
                        asset_id: {type: string}
                        asset_set: {type: string}
                        name: {type: string}
                        columns: {type: array, items: {type: string}}
                        row_count: {type: integer}
                        superseded: {type: boolean}
                        content_version: {type: [string, 'null']}
                        uploaded_at: {type: [string, 'null']}
        '400': {description: 数据集未指定所属项目}
        '403': {description: 无权访问该项目}
  /api/analysis/input-files/{asset_id}:
    get:
      tags: [Assets]
      summary: 读取明确输入版本的实际表头
      description: 只读解析所选指标表或其有效整理文件，不创建兼容文件记录。
      parameters:
        - {in: path, name: asset_id, required: true, schema: {type: string}}
        - {in: query, name: project_id, schema: {type: string}}
        - {in: query, name: asset_set, schema: {type: string}}
      responses:
        '200':
          description: 本次实际分析输入的表头和行数
          content:
            application/json:
              schema:
                type: object
                required: [id, asset_id, asset_set, name, columns, row_count]
                properties:
                  id: {type: string}
                  asset_id: {type: string}
                  asset_set: {type: string}
                  name: {type: string}
                  columns: {type: array, items: {type: string}}
                  row_count: {type: integer}
                  size: {type: integer}
        '400': {description: 项目或数据集不一致、输入类型不支持或整理来源失效}
        '403': {description: 无权访问该项目}
        '404': {description: 指定资产或文件已不存在}
  /api/script-hub/immune-infiltration/inspect:
    post:
      tags: [Jobs]
      summary: 检查免疫浸润组成与比较
      description: >
        当前项目/数据集解析注册输入。完整编号保留前导零及已有批次复合标识。
        selected_infiltration_samples/groups 使用检查返回的实际编号/分组，省略为全部，显式空列表拒绝。
        配对模式以 sample_pairs 为唯一范围，不读取上述样本筛选；未选行不属于编号不匹配。
        inspect 的 sample_scope_only=true 仅发现实际匹配范围；run 总是校验所选范围及该模式的样本门槛。
        通路方向比较需要匹配的 upstream_artifact_id/comparison；样本通路模式需要三类输入共同样本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptHubInfiltrationInput'
      responses:
        '200': {description: 真实匹配范围、分组计数与样本列表}
        '400': {description: 输入、实际样本范围、配对、来源或比较条件无效}
  /api/script-hub/immune-infiltration/run:
    post:
      tags: [Jobs]
      summary: 运行免疫浸润组成与比较
      description: >
        当前项目/数据集解析注册输入。完整编号保留前导零及已有批次复合标识。
        selected_infiltration_samples/groups 使用检查返回的实际编号/分组，省略为全部，显式空列表拒绝。
        配对模式以 sample_pairs 为唯一范围，不读取上述样本筛选；未选行不属于编号不匹配。
        inspect 的 sample_scope_only=true 仅发现实际匹配范围；run 总是校验所选范围及该模式的样本门槛。
        通路方向比较需要匹配的 upstream_artifact_id/comparison；样本通路模式需要三类输入共同样本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptHubInfiltrationInput'
      responses:
        '200': {description: 任务编号及状态地址，或复用匹配结果}
        '400': {description: 输入、实际样本范围、配对、来源或比较条件无效}
  /api/script-hub/immune-infiltration-consistency/inspect:
    post:
      tags: [Jobs]
      summary: 检查细胞组别校正相关性
      description: >
