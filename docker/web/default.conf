server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size ${UPLOAD_MAX_MB}m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"error_code":"FILE_TOO_LARGE","message":"上传请求超过大小上限（${UPLOAD_MAX_MB} 兆字节），请减少文件大小或分批上传。"}';
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:5000;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location ~ ^/(reports|static|auth)/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
