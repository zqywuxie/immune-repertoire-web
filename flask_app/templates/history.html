{% extends 'base.html' %}

{% block title %}历史记录{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>分析历史记录</h1>
        <div class="d-flex gap-2">
            <select class="form-select form-select-sm w-auto" id="statusFilter">
                <option value="">所有状态</option>
                <option value="completed">已完成</option>
                <option value="running">运行中</option>
                <option value="pending">等待中</option>
                <option value="failed">失败</option>
                <option value="cancelled">已取消</option>
            </select>
            <select class="form-select form-select-sm w-auto" id="typeFilter">
                <option value="">所有类型</option>
                <option value="similarity_heatmap">相似度热图</option>
                <option value="ig_metrics">IG指标分析</option>
                <option value="shm_analysis">SHM分析</option>
                <option value="bcell_maturation">B细胞成熟状态</option>
            </select>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadHistory()">
                <i class="bi bi-arrow-clockwise"></i> 刷新
            </button>
            <button class="btn btn-outline-danger btn-sm" id="batchDeleteBtn" style="display: none;">
                <i class="bi bi-trash"></i> 批量删除 (<span id="selectedCount">0</span>)
            </button>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row mb-4" id="statsCards">
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5 class="card-title">已完成</h5>
                    <h2 class="mb-0" id="completedCount">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5 class="card-title">运行中</h5>
                    <h2 class="mb-0" id="runningCount">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark">
                <div class="card-body">
                    <h5 class="card-title">等待中</h5>
                    <h2 class="mb-0" id="pendingCount">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white">
                <div class="card-body">
                    <h5 class="card-title">失败</h5>
                    <h2 class="mb-0" id="failedCount">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- Loading indicator -->
            <div class="text-center py-5" id="loadingIndicator">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2 text-muted">正在加载历史记录...</p>
            </div>

            <!-- History table -->
            <div class="table-responsive" id="historyTableContainer" style="display: none;">
                <table class="table table-hover" id="historyTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll" class="form-check-input">
                            </th>
                            <th>分析类型</th>
                            <th>模式</th>
                            <th>分析描述</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>完成时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History items will be loaded dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav id="paginationContainer" style="display: none;">
                <ul class="pagination justify-content-center" id="pagination">
                </ul>
            </nav>

            <!-- No history message -->
            <div class="text-center text-muted py-5" id="noHistoryMessage" style="display: none;">
                <i class="bi bi-clock-history display-4"></i>
                <p class="mt-3">暂无分析记录</p>
                <a href="{{ url_for('pages.analysis_config_page') }}" class="btn btn-outline-primary">开始第一次分析</a>
            </div>

            <!-- Error message -->
            <div class="alert alert-danger" id="errorMessage" style="display: none;">
                <i class="bi bi-exclamation-triangle"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除这条分析记录吗？此操作将同时删除所有相关的结果文件，且无法恢复。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
