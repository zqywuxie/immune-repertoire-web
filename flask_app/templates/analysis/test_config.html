<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析配置测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h4>分析配置测试页面</h4>
        <p class="text-muted">此页面用于测试优化后的分析配置界面</p>

        <div class="alert alert-info">
            <h6>测试要点：</h6>
            <ul class="mb-0">
                <li>检查分析类别下拉切换是否正常显示/隐藏相应内容</li>
                <li>检查字段分析类型下拉是否正确显示参数区域</li>
                <li>验证文件上传和样本选择功能</li>
                <li>确认所有JavaScript事件正常工作</li>
            </ul>
        </div>

        <iframe src="/analysis/config"
            style="width: 100%; height: 800px; border: 1px solid #dee2e6; border-radius: 4px;"></iframe>
    </div>

</html>
