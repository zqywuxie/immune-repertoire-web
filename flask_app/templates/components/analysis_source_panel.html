<div id="localSourcePanel">
    <div class="row g-3 align-items-end">
        <div class="col-lg-9">
            <label for="basePath" class="form-label">输入数据目录</label>
            <input
                type="text"
                class="form-control"
                id="basePath"
                placeholder="{{ local_placeholder|default('例如：E:\\Data\\Repertoire') }}"
            >
        </div>
        <div class="col-lg-3 d-grid">
            <button class="btn btn-primary" onclick="{{ analysis_js_object }}.scanFolder()">
                <i class="bi bi-search me-1"></i>{{ scan_button_label|default('扫描目录') }}
            </button>
        </div>
    </div>
    {% if local_hint %}
    <div class="mt-2">
        <small class="text-muted">
            <i class="bi bi-info-circle me-1"></i>{{ local_hint }}
        </small>
    </div>
    {% endif %}
    {% if folder_input_handler %}
    <input
        type="file"
        id="folderInput"
        webkitdirectory
        directory
        multiple
        style="display:none"
        onchange="{{ analysis_js_object }}.{{ folder_input_handler }}(event)"
    >
    {% endif %}
</div>

<div id="scanSummary" class="alert alert-info mt-3" style="display:none">
    <i class="bi bi-check-circle me-2"></i><span id="scanSummaryText"></span>
</div>
