{% set is_management = current_workspace == 'management' %}

<nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <button class="btn btn-sm btn-outline-secondary mb-3 w-100" id="sidebarCollapseBtn" title="收起或展开侧边栏">
        <i class="bi bi-chevron-left" id="collapseIcon"></i>
        <span class="nav-text ms-2">收起</span>
    </button>

    {% if is_management %}
    <div class="sidebar-section-label nav-text">数据管理</div>
    <ul class="nav flex-column" data-nav-scope="management">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.management_page' %}active{% endif %}"
                href="{{ url_for('pages.management_page') }}" data-nav-key="management-home">
                <i class="bi bi-grid"></i>
                <span class="nav-text ms-2">数据工作台</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint in ['pages.projects_page', 'pages.project_detail_page'] %}active{% endif %}"
                href="{{ url_for('pages.projects_page') }}" data-nav-key="projects">
                <i class="bi bi-kanban"></i>
                <span class="nav-text ms-2">项目库</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.samples_page' %}active{% endif %}"
                href="{{ url_for('pages.samples_page') }}" data-nav-key="samples">
                <i class="bi bi-collection"></i>
                <span class="nav-text ms-2">样本库</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.upload_page' %}active{% endif %}"
                href="{{ url_for('pages.upload_page') }}" data-nav-key="upload">
                <i class="bi bi-upload"></i>
                <span class="nav-text ms-2">数据上传</span>
            </a>
        </li>
        <hr class="my-3">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.settings_page' %}active{% endif %}"
                href="{{ url_for('pages.settings_page', workspace='management') }}" data-nav-key="settings">
                <i class="bi bi-gear"></i>
                <span class="nav-text ms-2">管理设置</span>
            </a>
        </li>
    </ul>
    {% else %}
    <div class="sidebar-section-label nav-text">分析工作区</div>
    <ul class="nav flex-column" data-nav-scope="analysis">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.analysis_page' %}active{% endif %}"
                href="{{ url_for('pages.analysis_page') }}" data-nav-key="analysis-home">
                <i class="bi bi-activity"></i>
                <span class="nav-text ms-2">数据分析</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.pipeline_comparison_page' %}active{% endif %}"
                href="{{ url_for('pages.pipeline_comparison_page') }}" data-nav-key="pipeline-comparison">
                <i class="bi bi-diagram-3"></i>
                <span class="nav-text ms-2">Pipeline 对比</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.script_hub_page' %}active{% endif %}"
                href="{{ url_for('pages.script_hub_page') }}" data-nav-key="script-hub">
                <i class="bi bi-terminal"></i>
                <span class="nav-text ms-2">项目综合分析</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.statistical_comparison_page' %}active{% endif %}"
                href="{{ url_for('pages.statistical_comparison_page') }}" data-nav-key="statistical">
                <i class="bi bi-graph-up"></i>
                <span class="nav-text ms-2">统计检验</span>
            </a>
        </li>

        <hr class="my-3">
        <div class="sidebar-section-label nav-text">工具</div>

        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.pdf_extractor_page' %}active{% endif %}"
                href="{{ url_for('pages.pdf_extractor_page') }}" data-nav-key="pdf-extractor">
                <i class="bi bi-file-earmark-pdf"></i>
                <span class="nav-text ms-2">PDF 表格提取</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.ppt_heatmap_page' %}active{% endif %}"
                href="{{ url_for('pages.ppt_heatmap_page') }}" data-nav-key="ppt-heatmap">
                <i class="bi bi-file-earmark-ppt"></i>
                <span class="nav-text ms-2">PPT 图表替换</span>
            </a>
        </li>

        <hr class="my-3">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'pages.settings_page' %}active{% endif %}"
                href="{{ url_for('pages.settings_page', workspace='analysis') }}" data-nav-key="settings">
                <i class="bi bi-gear"></i>
                <span class="nav-text ms-2">分析设置</span>
            </a>
        </li>
    </ul>
    {% endif %}
</nav>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
