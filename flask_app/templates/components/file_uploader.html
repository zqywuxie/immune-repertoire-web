<!-- File Uploader Component -->
<div class="file-uploader-component">
    <div class="mb-3">
        <label class="form-label">选择数据源</label>
        <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="fileSourceType" id="existingFileRadio" value="existing" checked>
            <label class="btn btn-outline-primary" for="existingFileRadio">
                <i class="bi bi-folder2-open me-1"></i>已上传文件
            </label>
            <input type="radio" class="btn-check" name="fileSourceType" id="newFileRadio" value="new">
            <label class="btn btn-outline-primary" for="newFileRadio">
                <i class="bi bi-cloud-upload me-1"></i>上传新文件
            </label>
        </div>
    </div>

    <!-- Existing File Selection -->
    <div id="existingFileSection">
        <div class="mb-3">
            <label for="projectFilterSelect" class="form-label">选择项目</label>
            <select class="form-select" id="projectFilterSelect">
                <option value="">全部项目</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="existingFileSelect" class="form-label">选择文件</label>
            <select class="form-select" id="existingFileSelect">
                <option value="">-- 请先选择项目 --</option>
            </select>
        </div>
    </div>

    <!-- New File Upload -->
    <div id="newFileSection" class="d-none">
        <div class="upload-drop-zone border rounded p-4 text-center mb-3" id="uploadDropZone">
            <i class="bi bi-cloud-arrow-up display-4 text-primary mb-2"></i>
            <p class="mb-2">拖放文件到此处</p>
            <p class="text-muted small mb-2">或</p>
            <label for="newFileInput" class="btn btn-primary">
                <i class="bi bi-folder2-open me-1"></i>选择文件
            </label>
            <input type="file" id="newFileInput" class="d-none" accept=".csv,.xlsx,.xls,.pdf">
            <p class="text-muted small mt-2 mb-0">支持 CSV、Excel、PDF 格式</p>
        </div>

        <!-- Upload Progress -->
        <div id="uploadProgress" class="d-none mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <small class="text-muted">上传中...</small>
                <small class="text-muted" id="uploadPercentage">0%</small>
            </div>
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                    id="uploadProgressBar" style="width: 0%"></div>
            </div>
        </div>

        <!-- Upload Success -->
        <div id="uploadSuccess" class="alert alert-success d-none">
            <i class="bi bi-check-circle me-2"></i>
            <span id="uploadSuccessMessage"></span>
        </div>

        <!-- Upload Error -->
        <div id="uploadError" class="alert alert-danger d-none">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="uploadErrorMessage"></span>
        </div>
    </div>

    <!-- Selected File Info -->
    <div id="selectedFileInfo" class="alert alert-info d-none">
        <i class="bi bi-file-earmark-check me-2"></i>
        已选择: <strong id="selectedFileName"></strong>
    </div>
</div>
