<!-- Mode Selector Component -->
<div class="mode-selector">
    <div class="row">
        <div class="col-12">
            <p class="text-muted mb-3">
                <i class="bi bi-info-circle me-1"></i>
                选择分析方式：使用预设方案快速分析，或自定义选择字段进行灵活分析
            </p>
        </div>
    </div>

    <div class="row g-3">
        <!-- Scheme Mode -->
        <div class="col-md-6">
            <div class="card h-100 mode-card" id="schemeModeCard">
                <div class="card-body text-center">
                    <input type="radio" class="btn-check" name="analysisMode" id="schemeModeRadio" value="scheme"
                        checked>
                    <label class="w-100" for="schemeModeRadio">
                        <div class="mode-icon mb-3">
                            <i class="bi bi-collection display-4 text-primary"></i>
                        </div>
                        <h5 class="card-title">预设方案</h5>
                        <p class="card-text text-muted">
                            选择预定义的分析方案，如B细胞同型分析、SHM分析等，快速执行常见分析任务
                        </p>
                        <div class="mt-3">
                            <span class="badge bg-primary">推荐</span>
                            <span class="badge bg-secondary">快速</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Custom Mode -->
        <div class="col-md-6">
            <div class="card h-100 mode-card" id="customModeCard">
                <div class="card-body text-center">
                    <input type="radio" class="btn-check" name="analysisMode" id="customModeRadio" value="custom">
                    <label class="w-100" for="customModeRadio">
                        <div class="mode-icon mb-3">
                            <i class="bi bi-sliders display-4 text-success"></i>
                        </div>
                        <h5 class="card-title">自定义字段</h5>
                        <p class="card-text text-muted">
                            手动选择要分析的字段，灵活配置分析参数，适合特殊需求和探索性分析
                        </p>
                        <div class="mt-3">
                            <span class="badge bg-success">灵活</span>
                            <span class="badge bg-secondary">高级</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Mode Description -->
    <div class="alert alert-info mt-3" id="modeDescription">
        <i class="bi bi-lightbulb me-2"></i>
        <strong>当前模式：预设方案</strong>
        <p class="mb-0 mt-2">
            您将从预定义的分析方案中选择一个，系统会自动配置所需的字段和参数。
        </p>
    </div>

    <!-- Continue Button -->
    <div class="text-end mt-3">
        <button class="btn btn-primary" id="continueToConfigBtn">
            <i class="bi bi-arrow-right me-2"></i>继续配置
        </button>
    </div>
</div>

<style>
    .mode-card {
        cursor: pointer;
        transition: all 0.3s;
        border: 2px solid #dee2e6;
    }

    .mode-card:hover {
        border-color: #0d6efd;
        box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
    }

    .mode-card label {
        cursor: pointer;
        padding: 1rem;
    }

    #schemeModeRadio:checked~label .mode-card,
    #schemeModeCard:has(#schemeModeRadio:checked) {
        border-color: #0d6efd;
        background: #e7f1ff;
    }

    #customModeRadio:checked~label .mode-card,
    #customModeCard:has(#customModeRadio:checked) {
        border-color: #198754;
        background: #d1e7dd;
    }

    .mode-icon {
        transition: transform 0.3s;
    }

    .mode-card:hover .mode-icon {
        transform: scale(1.1);
    }
</style>
