<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 免疫组库分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-brand">
            <span class="auth-kicker"><i class="bi bi-shield-lock"></i> Secure Workspace</span>
            <h1>免疫组库分析平台</h1>
            <p>登录后访问你的项目、分析任务和授权数据目录。</p>
        </section>
        <section class="auth-card">
            <h2>登录</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="post">
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="mb-3">
                    <label class="form-label" for="identifier">用户名或邮箱</label>
                    <input class="form-control" id="identifier" name="identifier" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <label class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember">
                        <span class="form-check-label">保持登录</span>
                    </label>
                    {% if config.AUTH_REGISTER_ENABLED %}
                    <a href="{{ url_for('auth.register') }}">注册账号</a>
                    {% endif %}
                </div>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-box-arrow-in-right me-1"></i>登录
                </button>
            </form>
        </section>
    </main>
</body>
</html>
