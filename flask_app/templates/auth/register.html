<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 免疫组库分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-brand">
            <span class="auth-kicker"><i class="bi bi-person-plus"></i> New Account</span>
            <h1>创建分析账号</h1>
            <p>每个账号拥有独立项目、资产、分析任务和服务器数据目录权限。</p>
        </section>
        <section class="auth-card">
            <h2>注册</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">用户名</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">邮箱</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_password">确认密码</label>
                    <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">
                    <i class="bi bi-person-check me-1"></i>创建账号
                </button>
                <a class="auth-secondary-link" href="{{ url_for('auth.login') }}">已有账号，返回登录</a>
            </form>
        </section>
    </main>
</body>
</html>
